version: '3.8'

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-xe
    environment:
      ORACLE_PASSWORD: Oracle123
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "oracle status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oracle-data:
